name: Claude PR review
description: >-
  Run anthropics/claude-code-action as a PR reviewer with the fleet's shared
  model and review defaults. The caller owns the prompt and the tool allowlist,
  because those differ per repository.

inputs:
  claude_code_oauth_token:
    description: The Claude Code OAuth token (secrets.CLAUDE_CODE_OAUTH_TOKEN).
    required: true
  prompt:
    description: The complete review prompt.
    required: true
  allowed_tools:
    description: >-
      Comma-separated Claude Code permission rules, passed as --allowed-tools.
      They add to the action's read-only base tool set.
    required: true

outputs:
  execution_file:
    description: >-
      Path to the claude-code-action execution file, for
      classify-claude-review.
    value: ${{ steps.review.outputs.execution_file }}

runs:
  using: composite
  steps:
    # Subagent tools are disallowed: they run in the background in a headless
    # runner, nothing re-invokes the parent, and a reviewer that ends its turn
    # "waiting" ends the run with nothing posted (hcos PR #3247, run
    # 30118014714). Both historical names are listed; an unmatched name is
    # harmless.
    - id: review
      uses: anthropics/claude-code-action@v1
      with:
        claude_code_oauth_token: ${{ inputs.claude_code_oauth_token }}
        prompt: ${{ inputs.prompt }}
        claude_args: >-
          --model claude-opus-5-5
          --allowed-tools "${{ inputs.allowed_tools }}"
          --disallowed-tools "Agent,Task"
