name: Claude PR text review
description: Review an exact PR head as data with no model tools, then post as claude[bot].
inputs:
  claude_code_oauth_token:
    description: Claude Code subscription OAuth token from a trusted main-only environment.
    required: true
  pr_number:
    description: PR number selected by the trusted caller.
    required: true
  reviewed_head_sha:
    description: Exact 40-character PR head to review.
    required: true
outputs:
  execution_file:
    description: Typed execution envelope for classify-claude-review.
    value: ${{ steps.review.outputs.execution_file }}
  result_file:
    description: Version 1 terminal result with distinct reviewed and producer SHAs.
    value: ${{ steps.review.outputs.result_file }}
  reviewed_head_sha:
    description: Reviewed PR head, never the producer workflow source SHA.
    value: ${{ steps.review.outputs.reviewed_head_sha }}
  producer_sha:
    description: Trusted workflow source SHA from github.workflow_sha.
    value: ${{ steps.review.outputs.producer_sha }}
  comment_id:
    description: Verified claude[bot] comment ID, set on completed only.
    value: ${{ steps.review.outputs.comment_id }}
  skip_reason:
    description: workflow-modified when the upstream App refuses workflow validation.
    value: ${{ steps.review.outputs.skip_reason }}
runs:
  using: composite
  steps:
    - id: cli
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        NODE_OPTIONS: ''
        BASH_ENV: ''
      run: node "$ACTION_PATH/install-claude.mjs"
    - id: review
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        CLAUDE_EXECUTABLE: ${{ steps.cli.outputs.executable }}
        CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.claude_code_oauth_token }}
        PR_NUMBER: ${{ inputs.pr_number }}
        REVIEWED_HEAD_SHA: ${{ inputs.reviewed_head_sha }}
        PRODUCER_SHA: ${{ github.workflow_sha }}
        NODE_OPTIONS: ''
        BASH_ENV: ''
      run: node "$ACTION_PATH/run-review.mjs"
