name: Claude PR review
description: >-
  Run anthropics/claude-code-action as a PR reviewer with the fleet's shared
  model and review defaults. The caller owns the prompt and the tool allowlist,
  because those differ per repository.

inputs:
  claude_code_oauth_token:
    description: The Claude Code OAuth token (secrets.CLAUDE_CODE_OAUTH_TOKEN).
    required: true
  prompt:
    description: The complete review prompt.
    required: true
  allowed_tools:
    description: >-
      Comma-separated Claude Code permission rules, passed as --allowed-tools.
      They add to the action's read-only base tool set.
    required: true

outputs:
  execution_file:
    description: >-
      Path to the claude-code-action execution file, for
      classify-claude-review.
    value: ${{ steps.review.outputs.execution_file }}
  skip_reason:
    description: >-
      Set only when claude-code-action returned success without running the
      reviewer. `workflow-modified`: the PR changes the review workflow, so
      the upstream workflow validation skipped the run. `not-executed`: no
      known cause. Either way this action fails and writes a marker that
      classify-claude-review reads. Empty on every normal run.
    value: ${{ steps.skip-check.outputs.skip_reason }}

runs:
  using: composite
  steps:
    # Subagent tools are disallowed: they run in the background in a headless
    # runner, nothing re-invokes the parent, and a reviewer that ends its turn
    # "waiting" ends the run with nothing posted (hcos PR #3247, run
    # 30118014714). Both historical names are listed; an unmatched name is
    # harmless.
    - id: review
      uses: anthropics/claude-code-action@v1
      with:
        claude_code_oauth_token: ${{ inputs.claude_code_oauth_token }}
        prompt: ${{ inputs.prompt }}
        claude_args: >-
          --model claude-opus-5-5
          --allowed-tools "${{ inputs.allowed_tools }}"
          --disallowed-tools "Agent,Task"

    # Runs only when the reviewer never ran: a normal run always sets
    # `conclusion`, and a failed review skips it via success().
    - id: skip-check
      if: success() && steps.review.outputs.conclusion == '' && steps.review.outputs.execution_file == ''
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        GITHUB_TOKEN_FOR_CHECK: ${{ github.token }}
        REPOSITORY: ${{ github.repository }}
        WORKFLOW_REF: ${{ github.workflow_ref }}
        WORKFLOW_SHA: ${{ github.workflow_sha || github.sha }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        PROMPT_PRESENT: ${{ inputs.prompt != '' }}
      run: node "$ACTION_PATH/detect-workflow-validation-skip.mjs"
