name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - name: Install schema test dependencies
        run: python3 -m pip install --require-hashes -r requirements-schema-tests.txt
      - name: Run declared full validation
        run: node scripts/validate.mjs full
