name: Test

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Capture CI run context
        continue-on-error: true
        timeout-minutes: 1
        uses: tommygwu/claude-review-actions/.github/actions/ci-run-context@e0b7fbb7e9502e2003bcfa9f56d93afabc0939e5
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: actions/setup-python@v6
        id: python
        with:
          python-version-file: .python-version
      - name: Install schema test dependencies
        env:
          UV_PYTHON: ${{ steps.python.outputs.python-path }}
        run: node scripts/setup-schema-tests.mjs
      - name: Run declared full validation
        run: bash scripts/run-ci-checks.sh
