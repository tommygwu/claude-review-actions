name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # The classifier is dependency-free and runs on the runner's bundled
      # Node, so there is nothing to install.
      - name: Run classifier parity suite
        run: node --test 'classify-claude-review/*.test.mjs'
