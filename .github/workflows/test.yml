name: Test

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Capture CI run context
        continue-on-error: true
        timeout-minutes: 1
        uses: tommygwu/claude-review-actions/.github/actions/ci-run-context@e0b7fbb7e9502e2003bcfa9f56d93afabc0939e5
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: actions/setup-python@v6
        id: python
        with:
          python-version-file: .python-version
      - name: Install schema test dependencies
        env:
          UV_PYTHON: ${{ steps.python.outputs.python-path }}
        run: node scripts/setup-schema-tests.mjs
      - name: Run Node tests
        run: bash scripts/run-node-tests.sh
      - name: Run CI context tests
        if: always()
        run: node scripts/run-python.mjs -B -m unittest discover -s .github/actions/ci-run-context -p 'test_*.py'
      - name: Run CI context schema tests
        if: always()
        run: node scripts/run-python.mjs -B scripts/test_run_context_schema.py
      - name: Run post-merge cadence tests
        if: always()
        run: node scripts/run-python.mjs -B -m unittest discover -s .github/actions/post-merge-cadence -p 'test_*.py'
